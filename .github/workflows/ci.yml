name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pyflakes
      - name: Lint (pyflakes)
        run: python -m pyflakes moga/autonomy moga/sim moga/map moga/common moga/eval moga/viz moga/scenarios/m*.py moga/scenarios/registry.py tests scripts
      - name: Unit tests and determinism
        run: python -m pytest -q -n auto -m "not scenario"

  scenarios:
    name: Closed-loop scenarios ${{ matrix.milestone }}
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        milestone: [m0, m1, m2, m3, m4, m5, m6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Scenarios
        run: python -m pytest -q -n auto tests/test_${{ matrix.milestone }}_scenarios.py

  report:
    name: Scenario report
    runs-on: ubuntu-latest
    needs: scenarios
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Run all scenarios
        run: python scripts/run_scenario.py --all --report out/SCENARIO_REPORT.md --json out/scenarios.json
      - uses: actions/upload-artifact@v4
        with:
          name: scenario-report
          path: out/
