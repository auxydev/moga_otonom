[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moga-otonom"
version = "0.1.0"
description = "Moga elektrikli otonom araç için Seviye 4 otonom sürüş yazılımı ve MogaSim simülatörü"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pillow>=10.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["moga*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
